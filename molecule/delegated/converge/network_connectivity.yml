---
# NOTE: The role pings from every host of network_connectivity_group to all
# the others. The peer is a second inventory host standing for the network
# namespace molecule-peer that the prepare step set up. Its facts cannot be
# gathered from inside the namespace (ip netns exec needs to remount /sys,
# which rootless containers used for local runs do not allow), so it gets the
# facts of its loopback0 in the shape setup reports them. The facts of this
# host and every ping are real, and every ping crosses the veth link.
- name: Add the peer host
  ansible.builtin.add_host:
    name: molecule-peer
    ansible_connection: local
    molecule_v4_interface: loopback0
    molecule_v4_address_family: ipv4
    molecule_v6_interface: loopback0
    molecule_v6_address_family: ipv6

- name: Set the facts of the peer host
  molecule_facts:
    facts:
      loopback0:
        device: loopback0
        mtu: 9000
        ipv4:
          address: "{{ network_connectivity_test_peer_ipv4 }}"
          prefix: "32"
        ipv6:
          - address: "{{ network_connectivity_test_peer_ipv6 }}"
            prefix: "128"
            scope: global
  delegate_to: molecule-peer
  delegate_facts: true

- name: Check IPv4 connectivity
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network_cidr: 198.51.100.0/24

# NOTE: Without the first assertion the test would pass as vacuously as the
# role does when it finds no address to ping. The ping size has to follow the
# MTU of the route to the peer, not that of loopback0 (9000), which holds the
# source address: for IPv4 that of veth-host (1400), for IPv6 that of the
# route itself (1300).
- name: Assert that the IPv4 check pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv4]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1372'

- name: Check IPv6 connectivity
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network_cidr: 2001:db8:42::/64

- name: Assert that the IPv6 check pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv6]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1252'

# NOTE: No host has an address in this network, so there is nothing to ping.
# The role has to fail instead of passing without having tested anything.
- name: Check a network without host addresses
  block:
    - name: Run the role on a network without host addresses
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-peer
        network_connectivity_network_cidr: 203.0.113.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_empty_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_empty_msg: "{{ ansible_failed_result.msg }}"

- name: Assert that the role failed for lack of addresses
  ansible.builtin.assert:
    that:
      - "'has no address' in network_connectivity_test_empty_msg"
    fail_msg: "Expected the role to fail for lack of addresses, got: {{ network_connectivity_test_empty_msg }}"

# NOTE: With network_connectivity_network the role takes each host's address
# from the interface and address family that the variables of that network
# name for the host, as kolla-ansible does for api, tunnel and so on.
- name: Check connectivity by network name
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network: "{{ test_network }}"
  loop:
    - molecule_v4
    - molecule_v6
  loop_control:
    loop_var: test_network

- name: Assert that the IPv6 check by network name pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv6]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1252'

# NOTE: A peer without an interface on the network cannot be pinged. With no
# other host left the role has to fail.
- name: Check a network that only this host has
  block:
    - name: Run the role on a network the peer has no interface on
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-peer
        network_connectivity_network: molecule_selfonly

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_peerless_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_peerless_msg: "{{ ansible_failed_result.msg }}"

- name: Assert that the role failed for lack of peer addresses
  ansible.builtin.assert:
    that:
      - "'None of the other hosts' in network_connectivity_test_peerless_msg"
    fail_msg: "Expected the role to fail for lack of peer addresses, got: {{ network_connectivity_test_peerless_msg }}"
