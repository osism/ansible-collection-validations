---
# NOTE: The role pings from every host of network_connectivity_group to all
# the others. The peer is a second inventory host standing for the network
# namespace molecule-peer that the prepare step set up. Its facts cannot be
# gathered from inside the namespace (ip netns exec needs to remount /sys,
# which rootless containers used for local runs do not allow), so it gets the
# facts of its loopback0 in the shape setup reports them. The facts of this
# host and every ping are real, and every ping crosses the veth link.
- name: Add the peer host
  ansible.builtin.add_host:
    name: molecule-peer
    ansible_connection: local
    molecule_v4_interface: loopback0
    molecule_v4_address_family: ipv4
    molecule_v6_interface: loopback0
    molecule_v6_address_family: ipv6

- name: Set the facts of the peer host
  molecule_facts:
    facts:
      loopback0:
        device: loopback0
        mtu: 9000
        ipv4:
          address: "{{ network_connectivity_test_peer_ipv4 }}"
          prefix: "32"
        ipv6:
          - address: "{{ network_connectivity_test_peer_ipv6 }}"
            prefix: "128"
            scope: global
  delegate_to: molecule-peer
  delegate_facts: true

- name: Check IPv4 connectivity
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network_cidr: 198.51.100.0/24

# NOTE: Without the first assertion the test would pass as vacuously as the
# role does when it finds no address to ping. The ping size has to follow the
# MTU of the route to the peer, not that of loopback0 (9000), which holds the
# source address: for IPv4 that of veth-host (1400), for IPv6 that of the
# route itself (1300).
- name: Assert that the IPv4 check pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv4]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1372'

- name: Check IPv6 connectivity
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network_cidr: 2001:db8:42::/64

- name: Assert that the IPv6 check pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv6]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1252'

# NOTE: No host has an address in this network, so there is nothing to ping.
# The role has to fail instead of passing without having tested anything.
- name: Check a network without host addresses
  block:
    - name: Run the role on a network without host addresses
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-peer
        network_connectivity_network_cidr: 203.0.113.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_empty_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_empty_msg: "{{ ansible_failed_result.msg }}"

- name: Assert that the role failed for lack of addresses
  ansible.builtin.assert:
    that:
      - "'has no address' in network_connectivity_test_empty_msg"
    fail_msg: "Expected the role to fail for lack of addresses, got: {{ network_connectivity_test_empty_msg }}"

# NOTE: With network_connectivity_network the role takes each host's address
# from the interface and address family that the variables of that network
# name for the host, as kolla-ansible does for api, tunnel and so on.
- name: Check connectivity by network name
  ansible.builtin.include_role:
    name: network_connectivity
  vars:
    network_connectivity_group:
      - "{{ inventory_hostname }}"
      - molecule-peer
    network_connectivity_network: "{{ test_network }}"
  loop:
    - molecule_v4
    - molecule_v6
  loop_control:
    loop_var: test_network

- name: Assert that the IPv6 check by network name pinged the peer
  ansible.builtin.assert:
    that:
      - ping.results | rejectattr('skipped', 'defined') | map(attribute='item.item') | list == [network_connectivity_test_peer_ipv6]
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1252'

# NOTE: A peer without an interface on the network cannot be pinged. With no
# other host left the role has to fail.
- name: Check a network that only this host has
  block:
    - name: Run the role on a network the peer has no interface on
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-peer
        network_connectivity_network: molecule_selfonly

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_peerless_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_peerless_msg: "{{ ansible_failed_result.msg }}"

- name: Assert that the role failed for lack of peer addresses
  ansible.builtin.assert:
    that:
      - "'None of the other hosts' in network_connectivity_test_peerless_msg"
    fail_msg: "Expected the role to fail for lack of peer addresses, got: {{ network_connectivity_test_peerless_msg }}"

# NOTE: molecule-far stands for the far host behind the peer and
# molecule-unreachable for an address that no namespace holds. Like the peer
# they get the facts of their loopback0.
- name: Add the far and the unreachable host
  ansible.builtin.add_host:
    name: "{{ item }}"
    ansible_connection: local
  loop:
    - molecule-far
    - molecule-unreachable

- name: Set the facts of the far and the unreachable host
  molecule_facts:
    facts:
      loopback0:
        device: loopback0
        mtu: 9000
        ipv4:
          address: "{{ item.address }}"
          prefix: "32"
  delegate_to: "{{ item.host }}"
  delegate_facts: true
  loop:
    - host: molecule-far
      address: "{{ network_connectivity_test_far_ipv4 }}"
    - host: molecule-unreachable
      address: "{{ network_connectivity_test_unreachable_ipv4 }}"
  loop_control:
    label: "{{ item.host }}"

# NOTE: The route to the far host has the MTU of veth-host (1400), the link
# behind the peer only 1300. The peer reports the smaller MTU, so the role
# has to fail and name it. The fail task fails per target, so the messages
# are those of its items.
- name: Check a hop that reports a smaller MTU
  block:
    - name: Run the role towards a host behind a hop with a smaller MTU
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-far
        network_connectivity_network_cidr: 198.51.100.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_far_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_far_msg: "{{ ansible_failed_result.results | default([ansible_failed_result]) | selectattr('msg', 'defined') | map(attribute='msg') | join(' ') }}"

- name: Assert that the role failed for the hop with a smaller MTU
  ansible.builtin.assert:
    that:
      - "'MTU 1400 of the route from 198.51.100.10 to 198.51.100.30 through veth-host is not usable' in network_connectivity_test_far_msg"
      - "'A hop on the path reported an MTU of 1300' in network_connectivity_test_far_msg"
    fail_msg: "Expected the role to fail for the MTU of the route, got: {{ network_connectivity_test_far_msg }}"

# NOTE: The kernel now caches the MTU of 1300 that the peer reported, for
# about ten minutes. A second run has to size its ping by the configured MTU
# again and fail the same way, instead of passing with the learned MTU.
- name: Check a hop that reports a smaller MTU again
  block:
    - name: Run the role towards the host behind the hop again
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-far
        network_connectivity_network_cidr: 198.51.100.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_far_again_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_far_again_msg: "{{ ansible_failed_result.results | default([ansible_failed_result]) | selectattr('msg', 'defined') | map(attribute='msg') | join(' ') }}"

- name: Assert that the role failed again with the configured MTU
  ansible.builtin.assert:
    that:
      - "'MTU 1400 of the route from 198.51.100.10 to 198.51.100.30 through veth-host is not usable' in network_connectivity_test_far_again_msg"
      - "'A hop on the path reported an MTU of 1300' in network_connectivity_test_far_again_msg"
      - ping.results[0].cmd[ping.results[0].cmd.index('-s') + 1] == '1372'
    fail_msg: "Expected the role to fail again with a ping of 1372 bytes, got: {{ network_connectivity_test_far_again_msg }}"

# NOTE: With the peer's end of the link at an MTU of 1300 the peer drops the
# packets of the size of the route MTU (1400) without a word, while small
# packets pass.
- name: Check a link that drops packets of the size of the route MTU
  block:
    - name: Lower the MTU of the peer's end of the link
      become: true
      ansible.builtin.command: nsenter --net=/run/netns/molecule-peer ip link set veth-peer mtu 1300
      changed_when: true

    - name: Run the role towards the peer behind the lowered MTU
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-peer
        network_connectivity_network_cidr: 198.51.100.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_drop_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_drop_msg: "{{ ansible_failed_result.results | default([ansible_failed_result]) | selectattr('msg', 'defined') | map(attribute='msg') | join(' ') }}"
  always:
    - name: Restore the MTU of the peer's end of the link
      become: true
      ansible.builtin.command: nsenter --net=/run/netns/molecule-peer ip link set veth-peer mtu 1400
      changed_when: true

- name: Read the link of the peer
  become: true
  ansible.builtin.command: nsenter --net=/run/netns/molecule-peer ip -o link show veth-peer
  register: network_connectivity_test_veth_peer
  changed_when: false

- name: Assert that the role failed for the dropped packets
  ansible.builtin.assert:
    that:
      - "'MTU 1400 of the route from 198.51.100.10 to 198.51.100.20 through veth-host is not usable' in network_connectivity_test_drop_msg"
      - "'No hop reported a smaller MTU' in network_connectivity_test_drop_msg"
      - "' mtu 1400 ' in network_connectivity_test_veth_peer.stdout"
    fail_msg: "Expected the role to fail for the dropped packets and veth-peer at MTU 1400, got: {{ network_connectivity_test_drop_msg }} / {{ network_connectivity_test_veth_peer.stdout }}"

# NOTE: The peer has no route to the unreachable address, so neither the
# ping of the size of the route MTU nor a small one is answered.
- name: Check a host that is not reachable
  block:
    - name: Run the role towards a host that is not reachable
      ansible.builtin.include_role:
        name: network_connectivity
      vars:
        network_connectivity_group:
          - "{{ inventory_hostname }}"
          - molecule-unreachable
        network_connectivity_network_cidr: 198.51.100.0/24

    - name: Record that the role passed
      ansible.builtin.set_fact:
        network_connectivity_test_unreachable_msg: passed
  rescue:
    - name: Record why the role failed
      ansible.builtin.set_fact:
        network_connectivity_test_unreachable_msg: "{{ ansible_failed_result.results | default([ansible_failed_result]) | selectattr('msg', 'defined') | map(attribute='msg') | join(' ') }}"

- name: Assert that the role failed for the unreachable host
  ansible.builtin.assert:
    that:
      - "'198.51.100.40 is not reachable from 198.51.100.10 through veth-host' in network_connectivity_test_unreachable_msg"
    fail_msg: "Expected the role to fail for the unreachable host, got: {{ network_connectivity_test_unreachable_msg }}"
