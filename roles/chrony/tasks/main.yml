---
# source: https://github.com/osism/ansible-playbooks/blob/main/playbooks/generic/validate-ntp.yml

- name: Get chrony tracking
  ansible.builtin.command:
    argv:
      - /usr/bin/chronyc
      - -c
      - tracking
  changed_when: false
  failed_when: false
  register: chrony_tracking

# NOTE: `chronyc -c tracking` prints 14 comma separated fields. The reference
# ID and the reference name are two distinct fields, hence the field count
# exceeds the number of rows shown by `chronyc tracking` by one.
- name: Assert that chronyd can be queried
  ansible.builtin.assert:
    that:
      - chrony_tracking.rc | default(1) == 0
      - chrony_tracking.stdout | default('') | split(',') | length == 14
    fail_msg: >-
      Unable to retrieve tracking information from chronyd.
      chronyc exited with rc {{ chrony_tracking.rc | default('unknown') }}:
      {{ chrony_tracking.stderr | default(chrony_tracking.msg) | default('') | trim }}

- name: Check chrony tracking
  vars:
    _tracking: "{{ chrony_tracking.stdout | split(',') }}"
  block:
    # NOTE: A chronyd which never synchronized reports the reference ID
    # 00000000 together with the leap status `Not synchronised`, while the
    # reference ID 7F7F0101 indicates that only the `local` mode is operating.
    # Neither of the two checks covers the other one.
    - name: Assert NTP is synchronized
      ansible.builtin.assert:
        that:
          - _tracking[13] != 'Not synchronised'
          - _tracking[0] != '7F7F0101'
        fail_msg: >-
          NTP not synchronized (leap status: {{ _tracking[13] }},
          reference ID: {{ _tracking[0] }})

    - name: Assert NTP stratum is less than desired max
      ansible.builtin.assert:
        that: _tracking[2] | int <= chrony_max_stratum
        fail_msg: "{{ _tracking[2] | int }} > {{ chrony_max_stratum }}"

    - name: Assert system clock offset from NTP time is less that desired max
      ansible.builtin.assert:
        that: _tracking[4] | float | abs <= chrony_max_system_clock_deviation | float
        fail_msg: "{{ _tracking[4] | float | abs }} > {{ chrony_max_system_clock_deviation | float }}"

    - name: Assert NTP upper bound of clock error is less than desired max
      vars:
        # NOTE: Calculation of upper bound of clock error was taken from `tracking` section of
        # https://manpages.debian.org/testing/chrony/chronyc.1.en.html#System_clock
        _clock_error: "{{ _tracking[4] | float | abs + _tracking[11] | float + 0.5 * _tracking[10] | float }}"
      ansible.builtin.assert:
        that: _clock_error | float <= chrony_max_upper_clock_error_bound | float
        fail_msg: "{{ _clock_error | float }} > {{ chrony_max_upper_clock_error_bound | float }}"

- name: Assert that the settings of the clock comparison are valid
  ansible.builtin.assert:
    that:
      - chrony_max_clock_difference | string is match('^([0-9]+([.][0-9]*)?|[.][0-9]+)([eE][-+]?[0-9]+)?$')
      - chrony_reference_timeout | string is match('^[0-9]+$')
      - chrony_reference_timeout | int > 0
    fail_msg: >-
      chrony_max_clock_difference must be a number >= 0 and chrony_reference_timeout
      an integer > 0 (got {{ chrony_max_clock_difference }} and {{ chrony_reference_timeout }})

# NOTE: All nodes have to measure against the same NTP server, hence the
# reference is selected once per batch. A run_once task is evaluated with the
# variables of the first host in inventory order, so the derived reference
# sorts the hosts to not depend on that order. Every host of the batch that
# ran the checks above passed them, so field 1 of its tracking holds the
# address of the NTP server it is synchronized to, or the name of a reference
# clock (e.g. PHC0), which the pattern skips.
- name: Select the reference of the clock comparison
  ansible.builtin.set_fact:
    _chrony_reference: >-
      {{
        chrony_reference_server | default('', true) | string
        if chrony_reference_server | default('', true) | string | length > 0
        else ansible_play_batch
        | sort
        | map('extract', hostvars)
        | selectattr('chrony_tracking.stdout', 'defined')
        | map(attribute='chrony_tracking.stdout')
        | map('split', ',')
        | map(attribute='1')
        | select('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}$|^[0-9A-Fa-f]*:[0-9A-Fa-f:.]*$')
        | first
        | default('')
      }}
  run_once: true

- name: Assert that a reference for the clock comparison is available
  ansible.builtin.assert:
    that: _chrony_reference | length > 0
    fail_msg: >-
      No node of this run tracks an NTP server by address, so there is no
      common reference. Set chrony_reference_server to an NTP server every
      node can reach.

# NOTE: The reference becomes a line of the chronyd configuration below, so
# only a single host name or IP address is accepted.
- name: Assert that the reference is a host name or an IP address
  ansible.builtin.assert:
    that: _chrony_reference is match('^[A-Za-z0-9._:-]+$')
    fail_msg: "chrony_reference_server must be a host name or an IP address (got '{{ _chrony_reference }}')"

# NOTE: Given configuration lines on the command line, chronyd does not read
# its configuration file. With -Q it only prints the offset of the system
# clock from the given server on stderr: it does not touch the clock, opens no
# server or command port and writes no pid file, so it runs next to the
# running chronyd and without root.
- name: Measure the offset of the system clock against the reference
  ansible.builtin.command:
    argv:
      - /usr/sbin/chronyd
      - -Q
      - -t
      - "{{ chrony_reference_timeout | int }}"
      - "server {{ _chrony_reference }} iburst"
  changed_when: false
  failed_when: false
  register: _chrony_reference_measurement

# NOTE: Every line chronyd prints starts with a timestamp. Apart from the lines
# it prints on every run, the last line tells why the measurement failed.
# chronyd before 4.3 prints no `Timeout reached` when the timeout expires.
- name: Assert that the offset against the reference was measured
  vars:
    _stderr_lines: >-
      {{
        (_chrony_reference_measurement.stderr | default('')).splitlines()
        | map('regex_replace', '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z ', '')
        | map('trim')
        | select
        | list
      }}
    _stderr_reasons: >-
      {{
        _stderr_lines
        | reject('match', '^(chronyd version .* starting|Disabled control of system clock|chronyd exiting)')
        | list
      }}
    _detail: >-
      {{
        _stderr_reasons | last
        if _stderr_reasons | length > 0
        else (
          'no offset within ' ~ (chrony_reference_timeout | int) ~ ' seconds'
          if _chrony_reference_measurement.rc | default(1) | int == 1 and _stderr_lines | length > 0
          else _stderr_lines | last | default(_chrony_reference_measurement.msg | default('unknown error'), true)
        )
      }}
  ansible.builtin.assert:
    that:
      - _chrony_reference_measurement.rc | default(1) | int == 0
      - _chrony_reference_measurement.stderr | default('') is search('System clock wrong by -?[0-9]+[.][0-9]+ seconds')
    fail_msg: >-
      Unable to measure the offset against the reference {{ _chrony_reference }}.
      chronyd -Q exited with rc {{ _chrony_reference_measurement.rc | default('unknown') }}:
      {{ _detail }}

- name: Set the offset against the reference
  ansible.builtin.set_fact:
    _chrony_reference_offset: >-
      {{
        _chrony_reference_measurement.stderr
        | regex_findall('System clock wrong by (-?[0-9]+[.][0-9]+) seconds')
        | first
        | float
      }}

# NOTE: The offsets are collected once per batch, because block variables are
# templated again on every use.
- name: Collect the offsets of the compared nodes
  ansible.builtin.set_fact:
    _chrony_compared: >-
      {%- set out = [] -%}
      {%- for h in ansible_play_batch | sort -%}
      {%- if hostvars[h]._chrony_reference_offset is defined -%}
      {%- set _ = out.append({'host': h, 'offset': hostvars[h]._chrony_reference_offset | float}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
  run_once: true

# NOTE: The comparison fails when the offsets differ by more than
# `chrony_max_clock_difference`. Then every node whose offset is more than
# half of it away from the median offset fails. The median lies between the
# smallest and the largest offset, so at least one node fails whenever the
# offsets differ by more than the tolerance, and no node fails otherwise.
# chronyd prints six decimals, so the spread and twice the distance from the
# median are whole microseconds and are rounded to absorb float errors.
- name: Compare the system clocks of the nodes
  vars:
    _chrony_offsets: "{{ _chrony_compared | map(attribute='offset') | map('float') | sort | list }}"
    _chrony_count: "{{ _chrony_offsets | length }}"
    _chrony_spread: "{{ ((_chrony_offsets | last | float) - (_chrony_offsets | first | float)) | round(6) }}"
    _chrony_median: >-
      {{
        _chrony_offsets[_chrony_count | int // 2] | float
        if _chrony_count | int is odd
        else ((_chrony_offsets[_chrony_count | int // 2 - 1] | float) + (_chrony_offsets[_chrony_count | int // 2] | float)) / 2
      }}
    _chrony_deviation: "{{ ((_chrony_reference_offset | float) - (_chrony_median | float)) | abs }}"
    _chrony_offsets_text: >-
      {%- set out = [] -%}
      {%- for c in _chrony_compared -%}
      {%- set _ = out.append(c.host ~ ': ' ~ '%.6f' | format(c.offset | float)) -%}
      {%- endfor -%}
      {{ out | join(', ') }}
  block:
    - name: Report the clock comparison
      ansible.builtin.debug:
        msg: >-
          Clock comparison against {{ _chrony_reference }}: {{ _chrony_count }} node(s),
          offsets differ by up to {{ '%.6f' | format(_chrony_spread | float) }} seconds
          (tolerance {{ chrony_max_clock_difference | float }}).
          Offsets: {{ _chrony_offsets_text }}
      run_once: true

    - name: Assert that the system clock agrees with the other nodes
      ansible.builtin.assert:
        that: >-
          _chrony_spread | float <= chrony_max_clock_difference | float
          or (2 * (_chrony_deviation | float)) | round(6) <= chrony_max_clock_difference | float
        fail_msg: >-
          The system clock of {{ inventory_hostname }} is
          {{ '%.7f' | format(_chrony_deviation | float) }} seconds from the median
          of the {{ _chrony_count }} compared nodes, and the nodes differ by up to
          {{ '%.6f' | format(_chrony_spread | float) }} seconds >
          {{ chrony_max_clock_difference | float }}. Offsets against
          {{ _chrony_reference }}: {{ _chrony_offsets_text }}
