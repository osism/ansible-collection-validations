---
- name: Assert provided group contains multiple hosts
  ansible.builtin.assert:
    that: network_connectivity_group | length > 1

- name: Assert provided network is valid
  ansible.builtin.assert:
    that: network_connectivity_network_cidr | ansible.utils.ipaddr is truthy

- name: Check connectivity to the other hosts
  vars:
    ip_version: "ipv{{ network_connectivity_network_cidr | ansible.utils.ipaddr('version') }}"
    # NOTE: Facts hold one IPv4 address per interface as a dict, but all IPv6
    # addresses of an interface as a list of dicts. Flattening by one level
    # gives a list of address dicts in both cases.
    address_entries: >-
      {{
        ansible_facts
        | dict2items
        | map(attribute='value')
        | selectattr(ip_version, 'defined')
        | map(attribute=ip_version)
        | flatten(levels=1)
        | selectattr('address', 'defined')
        | list
      }}
    source_addresses: >-
      {{
        address_entries
        | map(attribute='address')
        | ansible.utils.ipaddr(network_connectivity_network_cidr)
        | list
      }}
    ip_address: "{{ source_addresses | first }}"
    ip_header_size: "{{ 20 if ip_version == 'ipv4' else 40 }}"
    icmp_header_size: '8'
    # NOTE: The MTU of the route to a target: the one the route reports (a
    # locked route MTU or a learned path MTU), otherwise that of the device
    # the route leaves through. A route to a local address leaves through lo,
    # whose MTU exceeds the largest possible IP packet.
    route_mtu: >-
      {{
        [
          (
            item.stdout | regex_search(' mtu (lock )?([0-9]+)', '\2') | first
            if item.stdout is search(' mtu (lock )?[0-9]+')
            else ansible_facts[item.stdout | regex_search(' dev (\S+)', '\1') | first | replace('-', '_')].mtu
          ) | int,
          65535
        ] | min
      }}
    target_addresses: >-
      {{
        network_connectivity_group
        | difference([inventory_hostname])
        | map('extract', hostvars, 'ansible_facts')
        | map('dict2items')
        | map('map', attribute='value')
        | map('selectattr', ip_version, 'defined')
        | map('map', attribute=ip_version)
        | map('flatten', levels=1)
        | map('selectattr', 'address', 'defined')
        | map('map', attribute='address')
        | map('ansible.utils.ipaddr', network_connectivity_network_cidr)
        | list
        | flatten
      }}
  block:
    # NOTE: Without an address to ping the ping loop below is empty and the
    # role would pass without having tested anything.
    - name: Assert that this host has an address in the network
      ansible.builtin.assert:
        that: source_addresses | length > 0
        fail_msg: >-
          No address of {{ inventory_hostname }} is in
          {{ network_connectivity_network_cidr }}, nothing can be tested.

    - name: Assert that the other hosts have addresses in the network
      ansible.builtin.assert:
        that: target_addresses | length > 0
        fail_msg: >-
          No address of the other hosts in network_connectivity_group is in
          {{ network_connectivity_network_cidr }}, nothing can be tested.

    # NOTE: The ping size has to follow the route to the target, not the
    # interface that holds the source address. On a routed fabric the source
    # address is on a loopback or dummy interface whose MTU says nothing about
    # the path, and the kernel rejects a ping that does not fit the route.
    - name: Find the route to each of the other hosts
      ansible.builtin.command:
        argv:
          - ip
          - route
          - get
          - "{{ item }}"
          - from
          - "{{ ip_address }}"
      loop: "{{ target_addresses }}"
      register: routes
      changed_when: false

    - name: Run ping check with maximum possible length
      ansible.builtin.command:
        argv:
          - /bin/ping
          # quiet
          - -q
          # do not fragment
          - -M
          - do
          # set source IP
          - -I
          - "{{ ip_address }}"
          # use packets of the size of the route MTU
          - -s
          - "{{ route_mtu | int - ip_header_size | int - icmp_header_size | int }}"
          # send specified packet count
          - -c
          - "{{ network_connectivity_ping_count }}"
          - "{{ item.item }}"
      loop: "{{ routes.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: ping
      changed_when: false

    - name: Assert that ping check was successful
      ansible.builtin.assert:
        that: item.rc == 0
        quiet: true
      loop: "{{ ping.results }}"
      loop_control:
        label: "{{ item.stdout }}"
