---
- name: Assert provided group contains multiple hosts
  ansible.builtin.assert:
    that: network_connectivity_group | length > 1

- name: Assert provided network is valid
  ansible.builtin.assert:
    that: network_connectivity_network_cidr | ansible.utils.ipaddr is truthy
  when: network_connectivity_network | length == 0

# NOTE: With network_connectivity_network every host's address is that of
# its <network>_interface in the address family <network>_address_family,
# chosen the way kolla-ansible's kolla_address filter chooses it: for IPv4
# the primary address of the interface, or its first secondary that is not a
# loopback address if the primary is one; for IPv6 the first global address
# that is not a kolla VIP. The kolla variables computed with kolla_address
# (api_interface_address and so on) cannot be used instead, because they do
# not evaluate when read through hostvars.
- name: Find the addresses of all hosts on the network
  ansible.builtin.set_fact:
    network_connectivity_host_addresses: >-
      {{
        (network_connectivity_host_addresses if ansible_loop.index0 > 0 else {})
        | combine({item: host_address})
      }}
  vars:
    host_interface: "{{ hostvars[item][network_connectivity_network ~ '_interface'] | default('') }}"
    host_address_family: "{{ hostvars[item][network_connectivity_network ~ '_address_family'] | default('ipv4') | lower }}"
    host_interface_facts: "{{ hostvars[item].ansible_facts[host_interface | replace('-', '_')] | default({}) }}"
    host_ipv4_addresses: >-
      {{
        (
          ([host_interface_facts.ipv4] if host_interface_facts.ipv4 is defined else [])
          + host_interface_facts.ipv4_secondaries | default([])
        )
        | selectattr('address', 'defined')
        | map(attribute='address')
        | list
      }}
    host_ipv4_address: >-
      {{
        host_ipv4_addresses | reject('match', '127\.') | first | default('')
        if host_ipv4_addresses[:1] | select('match', '127\.') | list | length > 0
        else host_ipv4_addresses | first | default('')
      }}
    host_ipv6_address: >-
      {{
        host_interface_facts.ipv6 | default([])
        | selectattr('scope', 'equalto', 'global')
        | map(attribute='address')
        | reject('in', [hostvars[item].kolla_internal_vip_address | default(''), hostvars[item].kolla_external_vip_address | default('')])
        | first
        | default('')
      }}
    host_address: "{{ host_ipv4_address if host_address_family == 'ipv4' else host_ipv6_address }}"
  loop: "{{ network_connectivity_group }}"
  loop_control:
    extended: true
  when: network_connectivity_network | length > 0

- name: Check connectivity to the other hosts
  vars:
    # NOTE: Facts hold the primary IPv4 address of an interface as a dict,
    # further IPv4 addresses as a list of dicts in ipv4_secondaries, and all
    # IPv6 addresses as a list of dicts. Flattening by one level gives a list
    # of address dicts in all cases.
    address_entries: >-
      {{
        (
          ansible_facts
          | dict2items
          | map(attribute='value')
          | selectattr('ipv4', 'defined')
          | map(attribute='ipv4')
          | list
          + ansible_facts
          | dict2items
          | map(attribute='value')
          | selectattr('ipv4_secondaries', 'defined')
          | map(attribute='ipv4_secondaries')
          | flatten(levels=1)
          + ansible_facts
          | dict2items
          | map(attribute='value')
          | selectattr('ipv6', 'defined')
          | map(attribute='ipv6')
          | flatten(levels=1)
        )
        | selectattr('address', 'defined')
        | list
      }}
    source_addresses: >-
      {{
        (
          [network_connectivity_host_addresses[inventory_hostname]]
          | reject('equalto', '')
          | list
        )
        if network_connectivity_network | length > 0
        else (
          address_entries
          | map(attribute='address')
          | ansible.utils.ipaddr(network_connectivity_network_cidr)
          | list
        )
      }}
    target_addresses: >-
      {{
        (
          network_connectivity_host_addresses
          | dict2items
          | rejectattr('key', 'equalto', inventory_hostname)
          | map(attribute='value')
          | reject('equalto', '')
          | list
        )
        if network_connectivity_network | length > 0
        else (
          network_connectivity_group
          | difference([inventory_hostname])
          | map('extract', hostvars, 'ansible_facts')
          | map('dict2items')
          | map('map', attribute='value')
          | map('selectattr', 'ipv' ~ (network_connectivity_network_cidr | ansible.utils.ipaddr('version')), 'defined')
          | map('map', attribute='ipv' ~ (network_connectivity_network_cidr | ansible.utils.ipaddr('version')))
          | map('flatten', levels=1)
          | map('selectattr', 'address', 'defined')
          | map('map', attribute='address')
          | map('ansible.utils.ipaddr', network_connectivity_network_cidr)
          | list
          | flatten
        )
      }}
    ip_address: "{{ source_addresses | first }}"
    ip_version: "ipv{{ ip_address | ansible.utils.ipaddr('version') }}"
    ip_header_size: "{{ 20 if ip_version == 'ipv4' else 40 }}"
    icmp_header_size: '8'
    network_source: >-
      {{
        'on network ' ~ network_connectivity_network
        if network_connectivity_network | length > 0
        else 'in ' ~ network_connectivity_network_cidr
      }}
  block:
    # NOTE: Without an address to ping the ping loop below is empty and the
    # role would pass without having tested anything.
    - name: Assert that this host has an address in the network
      ansible.builtin.assert:
        that: source_addresses | length > 0
        fail_msg: >-
          {{ inventory_hostname }} has no address {{ network_source }},
          nothing can be tested.

    - name: Assert that the address of this host is on one of its interfaces
      ansible.builtin.assert:
        that: address_entries | selectattr('address', 'equalto', ip_address) | list | length > 0
        fail_msg: >-
          {{ ip_address }} is not configured on any interface of
          {{ inventory_hostname }}.

    - name: Assert that the other hosts have addresses in the network
      ansible.builtin.assert:
        that: target_addresses | length > 0
        fail_msg: >-
          None of the other hosts in network_connectivity_group has an
          address {{ network_source }}, nothing can be tested.

    # NOTE: The ping size follows the configured MTU of the route to the
    # target, not the MTU of the interface that holds the source address. On
    # a routed fabric the source address is on a loopback or dummy interface
    # whose MTU says nothing about the path.
    - name: Find the route to each of the other hosts
      ansible.builtin.command:
        argv:
          - ip
          - route
          - get
          - "{{ item }}"
          - from
          - "{{ ip_address }}"
      loop: "{{ target_addresses }}"
      register: routes
      changed_when: false

    # NOTE: The configured MTU of a route is its mtu, locked or not, otherwise
    # the MTU of the device it leaves through. ip route get also reports a
    # path MTU the kernel learned from a hop, and then hides the mtu of the
    # route. A learned path MTU is ignored: a failed ping teaches it to the
    # kernel, so sizing by it would make a run after a failed one pass.
    # ip route get fibmatch returns the route without it. A path with an
    # intentionally smaller hop declares it with mtu on the route. The device
    # is the one ip route get names, with ECMP the nexthop the ping is hashed
    # to. A route to a local address leaves through lo, whose MTU exceeds the
    # largest possible IP packet.
    - name: Find the configured route to each of the other hosts
      ansible.builtin.command:
        argv:
          - ip
          - route
          - get
          - fibmatch
          - "{{ item }}"
          - from
          - "{{ ip_address }}"
      loop: "{{ target_addresses }}"
      register: fib_routes
      changed_when: false

    - name: Find the MTU of the route to each of the other hosts
      ansible.builtin.set_fact:
        network_connectivity_route_mtus: >-
          {{
            (network_connectivity_route_mtus if ansible_loop.index0 > 0 else {})
            | combine({item.0.item: [route_mtu | int, 65535] | min})
          }}
      vars:
        route_dev: >-
          {{ item.0.stdout | regex_search(' dev (\S+)', '\1') | first }}
        route_mtu: >-
          {{
            item.1.stdout | regex_search(' mtu (lock )?([0-9]+)', '\2') | first
            if item.1.stdout is search(' mtu (lock )?[0-9]+')
            else ansible_facts[route_dev | replace('-', '_')].mtu | default(0)
          }}
      loop: "{{ routes.results | zip(fib_routes.results) | list }}"
      loop_control:
        extended: true
        label: "{{ item.0.item }}"

    - name: Assert that the MTU of the route to each of the other hosts is known
      ansible.builtin.assert:
        that: item.value | int > 0
        fail_msg: >-
          The route from {{ ip_address }} to {{ item.key }} leaves through a
          device without facts, gather the facts of {{ inventory_hostname }}
          after the device is created.
        quiet: true
      loop: "{{ network_connectivity_route_mtus | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # NOTE: Exit status 1 means that no reply came back, which the tasks
    # below diagnose. Exit status 2 is an error of ping itself.
    - name: Run ping check with maximum possible length
      ansible.builtin.command:
        argv:
          - /bin/ping
          # quiet
          - -q
          # do not fragment
          - -M
          - do
          # set source IP
          - -I
          - "{{ ip_address }}"
          # use packets of the size of the route MTU
          - -s
          - "{{ network_connectivity_route_mtus[item.item] | int - ip_header_size | int - icmp_header_size | int }}"
          # send specified packet count
          - -c
          - "{{ network_connectivity_ping_count }}"
          - "{{ item.item }}"
      loop: "{{ routes.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: ping
      changed_when: false
      failed_when: ping.rc > 1

    # NOTE: A target that did not answer is pinged again with the default
    # payload of 56 bytes, and its route is read again, which now shows a
    # path MTU that a hop reported during the ping. Together they tell an
    # unusable MTU from an unreachable host. Every failing target gets its
    # own message.
    - name: Ping the other hosts that did not answer with a minimal packet
      ansible.builtin.command:
        argv:
          - /bin/ping
          - -q
          - -M
          - do
          - -I
          - "{{ ip_address }}"
          - -c
          - "{{ network_connectivity_ping_count }}"
          - "{{ item }}"
      loop: "{{ ping.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.item') | list }}"
      register: small_ping
      changed_when: false
      failed_when: small_ping.rc > 1

    - name: Find the route to the other hosts that did not answer again
      ansible.builtin.command:
        argv:
          - ip
          - route
          - get
          - "{{ item }}"
          - from
          - "{{ ip_address }}"
      loop: "{{ ping.results | rejectattr('rc', 'equalto', 0) | map(attribute='item.item') | list }}"
      register: routes_after
      changed_when: false

    - name: Fail for the other hosts that did not answer the MTU-sized ping
      ansible.builtin.fail:
        msg: >-
          {{
            unreachable_msg
            if item.0.rc != 0
            else unusable_msg ~ ' ' ~ (
              'A hop on the path reported an MTU of ' ~ learned ~ '.'
              if learned | length > 0
              else 'No hop reported a smaller MTU, a device on the path drops packets of this size.'
            )
          }}
      vars:
        target: "{{ item.0.item }}"
        mtu: "{{ network_connectivity_route_mtus[target] }}"
        payload: "{{ mtu | int - ip_header_size | int - icmp_header_size | int }}"
        dev: >-
          {{ item.1.stdout | regex_search(' dev (\S+)', '\1') | first }}
        learned: >-
          {{
            item.1.stdout | regex_search('expires \S+ mtu ([0-9]+)', '\1') | first
            if item.1.stdout is search('expires \S+ mtu [0-9]+')
            else ''
          }}
        unusable_msg: >-
          MTU {{ mtu }} of the route from {{ ip_address }} to {{ target }}
          through {{ dev }} is not usable: a ping with {{ payload }} bytes and
          don't fragment is not answered, a ping with 56 bytes is.
        unreachable_msg: >-
          {{ target }} is not reachable from {{ ip_address }} through {{ dev }}:
          neither a ping with {{ payload }} bytes and don't fragment nor a ping
          with 56 bytes is answered.
      loop: "{{ small_ping.results | zip(routes_after.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
